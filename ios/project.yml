name: ListingForge
options:
  bundleIdPrefix: com.ctt
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true
  groupSortPosition: top

# Next.js backend (../api) surfaced in the Xcode navigator for browsing only.
# These are NOT part of any build target — the backend builds with npm/next.
# Only source/config paths are referenced so node_modules and .next stay out.
# NOTE: ../api/.env.example is deliberately NOT listed. xcodegen hard-fails on a
# missing fileGroup path, and that file has been deleted three times (renamed to
# .env instead of copied), each time breaking every `make build/test/run`. The
# file still lives in the repo for developers; the Xcode project just no longer
# depends on it existing.
fileGroups:
  - ../api/src
  - ../api/supabase
  - ../api/package.json
  - ../api/README.md

settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: "79AX4DYW78"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    PRIVACY_POLICY_URL: ""
    SUPPORT_URL: ""
    TERMS_URL: ""
    # Injected into Info.plist as API_BASE_URL.
  configs:
    Debug:
      API_BASE_URL: "http://localhost:3000"
    # Deliberately empty: the production endpoint is not invented here. The
    # Release build fails until a real HTTPS endpoint is supplied, so a
    # loopback URL can never reach App Review (Guideline 2.1).
    Release:
      API_BASE_URL: ""

targets:
  ListingForge:
    type: application
    platform: iOS
    attributes:
      SystemCapabilities:
        com.apple.InAppPurchase:
          enabled: 1
    sources:
      - path: ListingForge
      # StoreKit test configuration (SPEC §4.3). Navigator-only: it must never be
      # copied into the shipping app, so it lives outside the sources dir and has
      # no build phase. The scheme's Run action points at it (see below).
      - path: StoreKit/ListingForge.storekit
        buildPhase: none
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ctt.listingforge
        PRODUCT_NAME: ListingForge
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: ListingForge/ListingForge.entitlements
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_EMIT_LOC_STRINGS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    preBuildScripts:
      - name: Validate submission configuration
        basedOnDependencyAnalysis: false
        script: |
          /usr/bin/python3 "$SRCROOT/scripts/validate_release.py"
    info:
      path: ListingForge/Info.plist
      properties:
        CFBundleDisplayName: ListingForge
        API_BASE_URL: $(API_BASE_URL)
        PRIVACY_POLICY_URL: $(PRIVACY_POLICY_URL)
        SUPPORT_URL: $(SUPPORT_URL)
        TERMS_URL: $(TERMS_URL)
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        NSCameraUsageDescription: "ListingForge uses the camera to photograph your products for marketplace listings."
        NSPhotoLibraryUsageDescription: "ListingForge accesses your photo library to import product photos."
        NSPhotoLibraryAddUsageDescription: "ListingForge saves generated listing images to your photo library."
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait

  ListingForgeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ListingForgeTests
      - path: StoreKit/ListingForge.storekit
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ctt.listingforge.tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: ListingForge

  ListingForgeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: ListingForgeUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ctt.listingforge.uitests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: ListingForge

schemes:
  ListingForge:
    build:
      targets:
        ListingForge: all
        ListingForgeTests: [test]
        ListingForgeUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ListingForgeTests
        - ListingForgeUITests

  ListingForgeStoreKitTests:
    build:
      targets:
        ListingForge: all
        ListingForgeTests: [test]
    run:
      config: Debug
      storeKitConfiguration: StoreKit/ListingForge.storekit
    test:
      config: Debug
      environmentVariables:
        STOREKIT_LOCAL_TESTS: "1"
      targets:
        - ListingForgeTests
