name: ListingForge
options:
  bundleIdPrefix: com.ctt
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true
  groupSortPosition: top

# Next.js backend (../api) surfaced in the Xcode navigator for browsing only.
# These are NOT part of any build target — the backend builds with npm/next.
# Only source/config paths are referenced so node_modules and .next stay out.
# NOTE: ../api/.env.example is deliberately NOT listed. xcodegen hard-fails on a
# missing fileGroup path, and that file has been deleted three times (renamed to
# .env instead of copied), each time breaking every `make build/test/run`. The
# file still lives in the repo for developers; the Xcode project just no longer
# depends on it existing.
fileGroups:
  - ../api/src
  - ../api/supabase
  - ../api/package.json
  - ../api/README.md

settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: "79AX4DYW78"
    MARKETING_VERSION: "2.1.0"
    CURRENT_PROJECT_VERSION: "3"
    PRIVACY_POLICY_URL: "https://tiktoksellertool.vercel.app/privacy"
    SUPPORT_URL: "https://tiktoksellertool.vercel.app/support"
    TERMS_URL: "https://tiktoksellertool.vercel.app/terms"
    # Owner-provided backend, used by both Xcode runs and Release builds.
    # For local backend development, override API_BASE_URL in xcodebuild.
    API_BASE_URL: "https://tiktoksellertool.vercel.app"

targets:
  ListingForge:
    type: application
    platform: iOS
    attributes:
      SystemCapabilities:
        com.apple.InAppPurchase:
          enabled: 1
    sources:
      - path: ListingForge
      # StoreKit test configuration (SPEC §4.3). Navigator-only: it must never be
      # copied into the shipping app, so it lives outside the sources dir and has
      # no build phase. The scheme's Run action points at it (see below).
      - path: StoreKit/ListingForge.storekit
        buildPhase: none
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ctt.listingforge
        PRODUCT_NAME: ListingForge
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: ListingForge/ListingForge.entitlements
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_EMIT_LOC_STRINGS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    preBuildScripts:
      - name: Validate submission configuration
        basedOnDependencyAnalysis: false
        # Declared so the script phase sandbox allows reading it.
        inputFiles:
          - $(SRCROOT)/scripts/validate_release.py
        script: |
          /usr/bin/python3 "$SRCROOT/scripts/validate_release.py"
    info:
      path: ListingForge/Info.plist
      properties:
        CFBundleDisplayName: Listing Force
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        API_BASE_URL: $(API_BASE_URL)
        PRIVACY_POLICY_URL: $(PRIVACY_POLICY_URL)
        SUPPORT_URL: $(SUPPORT_URL)
        TERMS_URL: $(TERMS_URL)
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        NSCameraUsageDescription: "Listing Force uses the camera to photograph your products for marketplace listings."
        NSPhotoLibraryUsageDescription: "Listing Force accesses your photo library to import product photos."
        NSPhotoLibraryAddUsageDescription: "Listing Force saves generated listing images to your photo library."
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait

  ListingForgeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ListingForgeTests
      - path: StoreKit/ListingForge.storekit
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ctt.listingforge.tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: ListingForge

  ListingForgeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: ListingForgeUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ctt.listingforge.uitests
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: ListingForgeUITests/Info.plist
      properties:
        API_BASE_URL: $(API_BASE_URL)
    dependencies:
      - target: ListingForge

schemes:
  ListingForge:
    build:
      targets:
        ListingForge: all
        ListingForgeTests: [test]
        ListingForgeUITests: [test]
    run:
      config: Debug
      # Load the local product catalog when running in the simulator/Xcode.
      # Without a live App Store Connect environment, Product.products(for:)
      # returns nothing and the paywall shows "Plans are currently unavailable".
      # This only affects the Run action; Archive/Release use the real store.
      storeKitConfiguration: StoreKit/ListingForge.storekit
    test:
      config: Debug
      targets:
        - ListingForgeTests
        - ListingForgeUITests

  ListingForgeStoreKitTests:
    build:
      targets:
        ListingForge: all
        ListingForgeTests: [test]
    run:
      config: Debug
      storeKitConfiguration: StoreKit/ListingForge.storekit
    test:
      config: Debug
      environmentVariables:
        STOREKIT_LOCAL_TESTS: "1"
      targets:
        - ListingForgeTests
