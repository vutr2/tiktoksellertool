name: ListingForge
options:
  bundleIdPrefix: com.ctt
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true
  groupSortPosition: top

# Next.js backend (../api) surfaced in the Xcode navigator for browsing only.
# These are NOT part of any build target — the backend builds with npm/next.
# Only source/config paths are referenced so node_modules and .next stay out.
fileGroups:
  - ../api/src
  - ../api/supabase
  - ../api/package.json
  - ../api/README.md
  - ../api/.env.example

settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: "79AX4DYW78"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Overridable per environment; injected into Info.plist as API_BASE_URL.
    API_BASE_URL: "http://localhost:3000"

targets:
  ListingForge:
    type: application
    platform: iOS
    sources:
      - path: ListingForge
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ctt.listingforge
        PRODUCT_NAME: ListingForge
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: ListingForge/ListingForge.entitlements
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_EMIT_LOC_STRINGS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: ListingForge/Info.plist
      properties:
        CFBundleDisplayName: ListingForge
        API_BASE_URL: $(API_BASE_URL)
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        NSCameraUsageDescription: "ListingForge uses the camera to photograph your products for marketplace listings."
        NSPhotoLibraryUsageDescription: "ListingForge accesses your photo library to import product photos."
        NSPhotoLibraryAddUsageDescription: "ListingForge saves generated listing images to your photo library."
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait

  ListingForgeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ListingForgeTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ctt.listingforge.tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: ListingForge

  ListingForgeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: ListingForgeUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ctt.listingforge.uitests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: ListingForge

schemes:
  ListingForge:
    build:
      targets:
        ListingForge: all
        ListingForgeTests: [test]
        ListingForgeUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ListingForgeTests
        - ListingForgeUITests
